<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Precise Age Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>Precise Age Calculator</h1>

    <label for="dobInput">Enter your Date of Birth:</label>
    <!-- min/max stop the native picker from allowing absurd years like 0001 -->
    <input type="date" id="dobInput" min="1900-01-01" max="2026-07-08" />

    <button id="calculateBtn">Calculate Age</button>

    <div id="result"></div>
  </div>

  <!-- Load our JS logic file at the bottom, so the HTML above loads first -->
  <script src="script.js"></script>
</body>
</html>
