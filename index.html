<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Precise Age Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <p class="eyebrow">Know your age.....but precisely</p>
    <h1>Precise Age Calculator</h1>

    <div class="input-row">
      <label>Date of birth</label>
      <div class="dob-selects">
        <select id="dayInput"></select>
        <select id="monthInput"></select>
        <input type="number" id="yearInput" placeholder="Year" min="1" max="2026" />
      </div>
      <button id="calculateBtn">Calculate</button>
    </div>

    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
